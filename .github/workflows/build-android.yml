name: reVC Android Build (Stable)

on:
  push:
    branches: ["miami"]
    paths:
      - "android/launcher/**"
      - "src/**"
  pull_request:
    branches: ["miami"]
    paths:
      - "android/launcher/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/launcher

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ✅ FINAL FIX: disable SDL2 + GLFW completely
      - name: Patch librw (Android compatible)
        run: |
          sed -i 's/set(LIBRW_GL3_GFXLIB      "SDL2"/set(LIBRW_GL3_GFXLIB      "NONE"/g' ../../vendor/librw/CMakeLists.txt
          sed -i 's/set(LIBRW_GL3_GFXLIB      "GLFW"/set(LIBRW_GL3_GFXLIB      "NONE"/g' ../../vendor/librw/CMakeLists.txt
          sed -i 's/-DLIBRW_SDL2 -DUSE_SDL2//g' ../../vendor/librw/CMakeLists.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean build cache
        run: rm -rf ~/.gradle/caches build .cxx

      - name: Gradle clean
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reVC-debug
          path: android/launcher/app/build/outputs/apk/debug/*.apk


  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-debug

    defaults:
      run:
        working-directory: android/launcher

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ✅ SAME PATCH HERE
      - name: Patch librw (Android compatible)
        run: |
          sed -i 's/set(LIBRW_GL3_GFXLIB      "SDL2"/set(LIBRW_GL3_GFXLIB      "NONE"/g' ../../vendor/librw/CMakeLists.txt
          sed -i 's/set(LIBRW_GL3_GFXLIB      "GLFW"/set(LIBRW_GL3_GFXLIB      "NONE"/g' ../../vendor/librw/CMakeLists.txt
          sed -i 's/-DLIBRW_SDL2 -DUSE_SDL2//g' ../../vendor/librw/CMakeLists.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean build cache
        run: rm -rf ~/.gradle/caches build .cxx

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --build-cache

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: reVC-release
          path: android/launcher/app/build/outputs/apk/release/*.apk
