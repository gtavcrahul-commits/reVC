name: reVC Android Build (Stable)

on:
  push:
    branches: ["miami"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/launcher

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ✅ CORRECT PATCH
      - name: Patch librw correctly (Android fix)
        run: |
          sed -i '/elseif(ANDROID)/,/else()/ s/-DLIBRW_SDL2 -DUSE_SDL2//g' ../../vendor/librw/CMakeLists.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - run: chmod +x ./gradlew

      - name: Clean
        run: rm -rf ~/.gradle/caches build .cxx && ./gradlew clean

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
